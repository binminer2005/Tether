{% extends "base.html" %}
{% block title %}Đăng ký — Tether{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Tạo tài khoản Tether</h1>
    <p class="auth-sub">Tham gia để nhận bản tin và lưu lại những bài viết, tập nghe bạn thích.</p>
    <a class="google-login" href="{{ url_for('google_login') }}"><img width="25" height="25" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> <span>Đăng ký bằng Google</span></a>
    <div class="auth-divider"><span>hoặc đăng ký bằng email</span></div>
    <form method="post">
      <div class="field">
        <label for="name">Họ và tên</label>
        <input type="text" id="name" name="name" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ban@email.com" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" required>
      </div>
      <button type="submit" class="btn btn-primary">Đăng ký</button>
    </form>
    <div class="auth-switch">
      Đã có tài khoản? <a href="{{ url_for('sign') }}">Đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
